name: Publish BbQ.Cqrs package family to NuGet

on:
  push:
    tags:
      - 'cqrs-v*'
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/BbQ.Cqrs/BbQ.Cqrs.csproj
          dotnet restore src/BbQ.Cqrs.SourceGenerators/BbQ.Cqrs.SourceGenerators.csproj
          dotnet restore src/BbQ.Cqrs.Outcome/BbQ.Cqrs.Outcome.csproj
          dotnet restore src/BbQ.Cqrs.Outcome.FluentValidation/BbQ.Cqrs.Outcome.FluentValidation.csproj
          dotnet restore tests/BbQ.Cqrs.Tests/BbQ.Cqrs.Tests.csproj
          dotnet restore tests/BbQ.Outcome.Integrations.Tests/BbQ.Outcome.Integrations.Tests.csproj

      - name: Build package family
        run: |
          dotnet build src/BbQ.Cqrs/BbQ.Cqrs.csproj --configuration Release --no-restore
          dotnet build src/BbQ.Cqrs.SourceGenerators/BbQ.Cqrs.SourceGenerators.csproj --configuration Release --no-restore
          dotnet build src/BbQ.Cqrs.Outcome/BbQ.Cqrs.Outcome.csproj --configuration Release --no-restore
          dotnet build src/BbQ.Cqrs.Outcome.FluentValidation/BbQ.Cqrs.Outcome.FluentValidation.csproj --configuration Release --no-restore

      - name: Test CQRS package family
        run: |
          dotnet test tests/BbQ.Cqrs.Tests/BbQ.Cqrs.Tests.csproj --configuration Release --verbosity normal
          dotnet test tests/BbQ.Outcome.Integrations.Tests/BbQ.Outcome.Integrations.Tests.csproj --configuration Release --verbosity normal

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#cqrs-v}"
          expected=$(dotnet msbuild src/BbQ.Cqrs/BbQ.Cqrs.csproj -getProperty:Version)
          test "$version" = "$expected" || { echo "Tag version $version differs from project version $expected"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack CQRS package family
        run: |
          dotnet pack src/BbQ.Cqrs/BbQ.Cqrs.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/BbQ.Cqrs.SourceGenerators/BbQ.Cqrs.SourceGenerators.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/BbQ.Cqrs.Outcome/BbQ.Cqrs.Outcome.csproj --configuration Release --no-build -o ./artifacts
          dotnet pack src/BbQ.Cqrs.Outcome.FluentValidation/BbQ.Cqrs.Outcome.FluentValidation.csproj --configuration Release --no-build -o ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package family to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
