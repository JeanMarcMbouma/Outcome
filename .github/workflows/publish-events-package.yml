name: Publish BbQ.Events package family to NuGet

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  validate-providers:
    uses: ./.github/workflows/events-provider-validation.yml

  build-and-publish:
    needs: validate-providers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore and build Events package family
        shell: bash
        run: |
          for project in BbQ.Events BbQ.Events.SourceGenerators BbQ.Events.SqlServer BbQ.Events.PostgreSql BbQ.Events.RabbitMQ; do
            dotnet restore "src/$project/$project.csproj"
            dotnet build "src/$project/$project.csproj" --configuration Release --no-restore
          done

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#events-v}"
          for project in BbQ.Events BbQ.Events.SourceGenerators BbQ.Events.SqlServer BbQ.Events.PostgreSql BbQ.Events.RabbitMQ; do
            expected=$(dotnet msbuild "src/$project/$project.csproj" -getProperty:Version)
            test "$version" = "$expected" || { echo "Tag version $version differs from $project version $expected"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack Events package family
        shell: bash
        run: |
          for project in BbQ.Events BbQ.Events.SourceGenerators BbQ.Events.SqlServer BbQ.Events.PostgreSql BbQ.Events.RabbitMQ; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --no-build -o ./artifacts
          done

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push Events package family to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
          RELEASE_VERSION: ${{steps.version.outputs.version}}
        run: |
          for project in BbQ.Events.SourceGenerators BbQ.Events BbQ.Events.SqlServer BbQ.Events.PostgreSql BbQ.Events.RabbitMQ; do
            dotnet nuget push "./artifacts/$project.$RELEASE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Push Symbols
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
