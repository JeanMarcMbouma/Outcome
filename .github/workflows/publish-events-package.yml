name: Publish BbQ.Events to NuGet

on:
  push:
    tags:
      - 'events-v*'  # Triggers on tags like events-v1.0.0, events-v1.0.1
  workflow_call:      # Allow main.yml to call this workflow

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/BbQ.Events/BbQ.Events.csproj
          dotnet restore src/BbQ.Events.SourceGenerators/BbQ.Events.SourceGenerators.csproj

      - name: Build
        run: |
          dotnet build src/BbQ.Events/BbQ.Events.csproj --configuration Release --no-restore
          dotnet build src/BbQ.Events.SourceGenerators/BbQ.Events.SourceGenerators.csproj --configuration Release --no-restore

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#events-v}"
          expected=$(dotnet msbuild src/BbQ.Events/BbQ.Events.csproj -getProperty:Version)
          test "$version" = "$expected" || { echo "Tag version $version differs from project version $expected"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack BbQ.Events
        run: dotnet pack src/BbQ.Events/BbQ.Events.csproj --configuration Release --no-build -o ./artifacts

      - name: Pack BbQ.Events.SourceGenerators
        run: dotnet pack src/BbQ.Events.SourceGenerators/BbQ.Events.SourceGenerators.csproj --configuration Release --no-build -o ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push Symbols
        run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
